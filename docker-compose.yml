services:
  postgres:
    image: postgres:16
    container_name: chorewars-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-chorewars}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: chorewars-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  kafka:
    image: apache/kafka:3.7.0
    container_name: chorewars-kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      - kafka
    command:
      - /bin/bash
      - -c
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
          sleep 2
        done
        for topic in chore.completed bounty.created bounty.accepted chore.overdue bounty.expired season.ended chore.deadline_reminder chat.message_created supply.notification; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 1 --replication-factor 1
        done

  backend:
    command: ["--urls", "http://0.0.0.0:8080"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chorewars-backend
    restart: always
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-chorewars};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Redis__ConnectionString=redis:6379
      - Kafka__BootstrapServers=kafka:9092
      - MediaStorage__RootPath=/app/private-media
      - Supplies__PayOS__OperatorUserId=${SUPPLIER_OPERATOR_USER_ID:-00000000-0000-0000-0000-000000000000}
      - Supplies__PayOS__Enabled=${SUPPLIER_PAYOS_ENABLED:-false}
      - Supplies__PayOS__ClientId=${SUPPLIER_PAYOS_CLIENT_ID:-}
      - Supplies__PayOS__ApiKey=${SUPPLIER_PAYOS_API_KEY:-}
      - Supplies__PayOS__ChecksumKey=${SUPPLIER_PAYOS_CHECKSUM_KEY:-}
      - Supplies__PayOS__AccountNumber=${SUPPLIER_PAYOS_ACCOUNT_NUMBER:-}
      - Supplies__PayOS__WebBaseUrl=${SUPPLIER_WEB_BASE_URL:-}
      - Jwt__Secret=${JWT_SECRET:-chorewars_super_secret_key_which_should_be_long_enough_for_hmac_sha256}
      - Jwt__Issuer=${JWT_ISSUER:-ChoreWars}
      - Jwt__Audience=${JWT_AUDIENCE:-ChoreWarsUsers}
    ports:
      - "8081:8080"
    volumes:
      - private_media:/app/private-media
      - avatar_media:/app/.local-data/avatars
      - data_protection_keys:/app/.data-protection-keys

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: chorewars-mobile
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  private_media:
  avatar_media:
  data_protection_keys:
  postgres_data:
  redis_data:
  kafka_data:
